[package]
name = "nes-emu"
version = "0.1.0"
edition = "2021"
description = "A Nintendo Entertainment System (NES) emulator written in Rust from scratch."
license = "MIT"
publish = false

[dependencies]
sdl2 = { version = "0.37" }
serde = { version = "1", features = ["derive"] }
bincode = "1"
toml = { version = "1.1.3", features = ["parse", "display"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# Fast iteration profile — keeps good optimization but drops LTO and
# increases codegen-units for much faster compile times.
# Use with: cargo build --profile fast
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 2

# Optimized profile for benchmarks — matches release settings so criterion
# measures real-world performance instead of unoptimized debug builds.
# `panic = "abort"` is intentionally omitted: the bench profile requires
# unwinding for criterion's own panic-handling, and cargo emits a warning
# if `panic = "abort"` is set here.
[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bench]]
name = "frame_bench"
harness = false
