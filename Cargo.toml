[package]
name = "nes-emu"
version = "0.1.0"
edition = "2021"
description = "A Nintendo Entertainment System (NES) emulator written in Rust from scratch."
license = "MIT"
publish = false

[dependencies]
sdl2 = "0.37"
serde = { version = "1", features = ["derive"] }
bincode = "1"
toml = { version = "1.1.3", features = ["parse", "display"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
